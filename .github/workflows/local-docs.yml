name: Local device docs

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out device repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: device
          submodules: recursive

      - name: Check out UniXNU tools
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: tools

      - name: Install Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/docs/package-lock.json

      - name: Validate the local porting record
        run: python3 device/scripts/porting-record.py check --device device

      - name: Prepare the local catalog and record snapshot
        env:
          DEVICE_REPOSITORY: ${{ github.repository }}
          DEVICE_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          import tomllib
          from pathlib import Path

          device = Path('device')
          tools = Path('tools')
          board = tomllib.loads((device / 'board.toml').read_text())
          record = tomllib.loads((device / 'porting.toml').read_text())
          identity = board['board']
          name = identity['name']
          entry = {
              'name': name,
              'repository': os.environ['DEVICE_REPOSITORY'],
              'title': f"{identity.get('description', name)} ({name})",
              'title_zh': f"{identity.get('description', name)}（{name}）",
              'format': 2,
              'legacy_page': 'link',
              'soc': str(identity['soc']),
              'summary': record['device']['summary'],
              'revision': os.environ['DEVICE_REVISION'],
              'board': name,
              'os_profile': str(identity['os_profile']),
              'components': board['components']['include'],
              'record_state': 'available',
          }
          tools.joinpath('devices.toml').write_text(
              'schema_version = 2\n\n[[device]]\n'
              + ''.join(f'{key} = {json.dumps(value, ensure_ascii=False)}\n'
                        for key, value in entry.items()))
          snapshot = tools / 'docs/.vitepress/device-records' / f'{name}.toml'
          snapshot.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(device / 'porting.toml', snapshot)
          print('catalog entry:', name, os.environ['DEVICE_REVISION'])
          PY

      - name: Render with the upstream catalog renderer
        run: python3 scripts/sync-devices.py --render
        working-directory: tools

      - name: Build the documentation site
        run: |
          npm ci
          npm run build
        working-directory: tools/docs

      - name: Verify generated pages
        run: |
          test -s tools/docs/devices/merlinx.md
          test -s tools/docs/zh/devices/merlinx.md
          test -s tools/docs/.vitepress/device-records/merlinx.toml

      - name: Sync the device branch before publishing
        run: |
          git -C device fetch origin "$GITHUB_REF_NAME"
          git -C device rebase "origin/$GITHUB_REF_NAME"

      - name: Copy the official generated documentation
        run: |
          mkdir -p device/docs/.vitepress/device-records
          cp tools/docs/devices/merlinx.md device/docs/devices/merlinx.md
          cp tools/docs/zh/devices/merlinx.md device/docs/zh/devices/merlinx.md
          cp tools/docs/.vitepress/device-records/merlinx.toml device/docs/.vitepress/device-records/merlinx.toml

      - name: Add the related-repository table
        run: python3 device/scripts/render-repositories.py device

      - name: Commit and publish the generated documentation
        env:
          GIT_AUTHOR_NAME: UniXNU Docs
          GIT_AUTHOR_EMAIL: docs@unixnu.com
          GIT_COMMITTER_NAME: UniXNU Docs
          GIT_COMMITTER_EMAIL: docs@unixnu.com
        run: |
          git -C device add docs/devices/merlinx.md docs/zh/devices/merlinx.md \
            docs/.vitepress/device-records/merlinx.toml
          if ! git -C device diff --cached --quiet; then
            git -C device commit -m "docs: refresh generated merlinx documentation"
            git -C device push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Upload generated documentation
        uses: actions/upload-artifact@v4
        with:
          name: merlinx-docs-${{ github.run_id }}
          path: |
            tools/docs/devices/merlinx.md
            tools/docs/zh/devices/merlinx.md
            tools/docs/.vitepress/device-records/merlinx.toml
          if-no-files-found: error
