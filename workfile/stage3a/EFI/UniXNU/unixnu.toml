version = 1

[boot]
timeout = 30
default = "stage3a"
rotate = 2

[ui]
title = "UniXNU / merlinx"

[[entry]]
id = "stage3a"
title = "Stage 3A: FAT payload"
type = "action"
action = "exit"

[[entry]]
id = "reset"
title = "Restart"
type = "action"
action = "reset"

[[entry]]
id = "shutdown"
title = "Power off"
type = "action"
action = "shutdown"
